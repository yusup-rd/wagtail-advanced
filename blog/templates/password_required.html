{% extends "base.html" %}
{% load i18n %}
{% block content %}
    <h1>{% trans "Password required" %}</h1>
    {% block password_required_message %}
        <p>{% trans "This page is private. Please log in to view it." %}</p>
    {% endblock password_required_message %}
    <form method="post" action="{{ action_url }}">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="{% trans "Continue" %}" class="button" />
    </form>
{% endblock content %}
