{% load wagtailcore_tags %}
{% if warning %}
    <div style="background-color: #ffcccb;
                color: #333;
                padding: 10px;
                margin-bottom: 20px">{{ warning }}</div>
{% endif %}
<div style="background-color: #333; color: #fff; padding: 20px;">
    <h1>{{ object.name }} - Preview of author snippet - DARK</h1>
    <div class="author-bio">{{ object.bio|richtext }}</div>
</div>
